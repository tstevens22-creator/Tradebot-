# Daily adversarial review: SIMULATION ONLY. No secrets, no network calls to
# trading venues, no real funds. It never deploys or changes risk settings.
name: daily-adversarial

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit, property and fault-injection tests
        run: python -m pytest -q
      - name: Daily adversarial scenarios
        run: python -m tradebot.adversarial.daily --out reports
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-report
          path: reports/
